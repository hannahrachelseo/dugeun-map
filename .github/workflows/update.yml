name: 지도 데이터 자동 업데이트
on:
  schedule:
    - cron: '17 19 1 * *'   # 매달 2일 새벽 4시 17분(한국 시간)에 확인
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 최신 행정동 경계 찾기
        id: find
        run: |
          git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/vuski/admdongkor src
          f=$(git -C src ls-tree -r --name-only HEAD | grep -E '^ver[0-9]{8}/HangJeongDong_ver[0-9]{8}\.geojson$' | sort | tail -1)
          echo "file=$f" >> "$GITHUB_OUTPUT"
          echo "ver=$(echo $f | grep -oE '[0-9]{8}' | head -1)" >> "$GITHUB_OUTPUT"
      - name: 이미 최신이면 건너뛰기
        id: chk
        run: |
          cur=$(python -c "import json;print(json.load(open('mapdata.json'))['ver'])" 2>/dev/null || echo 0)
          if [ "${{ steps.find.outputs.ver }}" \> "$cur" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "최신이에요 ($cur)"; fi
      - name: 지도 데이터 다시 만들기
        if: steps.chk.outputs.go == '1'
        run: |
          git -C src checkout HEAD -- "${{ steps.find.outputs.file }}"
          pip install shapely==2.0.6
          python scripts/build.py "src/${{ steps.find.outputs.file }}" mapdata.json
      - name: 올리기
        if: steps.chk.outputs.go == '1'
        run: |
          git config user.name "dugeun-bot"
          git config user.email "actions@users.noreply.github.com"
          git add mapdata.json
          git commit -m "지도 데이터 ${{ steps.find.outputs.ver }} 기준으로 업데이트"
          git push
